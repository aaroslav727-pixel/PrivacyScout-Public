name: Build iOS IPA

on:
  workflow_dispatch:   # ручной запуск кнопкой Run workflow
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -eo pipefail
          xcodebuild \
            -project PrivacyScout.xcodeproj \
            -scheme PrivacyScout \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PrivacyScout.app Payload/
          zip -qr PrivacyScout.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyScout-ipa
          path: PrivacyScout.ipa
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
